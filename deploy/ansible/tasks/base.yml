---
- name: Install base operational packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - iproute2
      - nftables
      - openssh-server
      - python3-debian
      - python3-psycopg2
      - sudo
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Apply safe package upgrades
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 3600

- name: Create the administrator account
  ansible.builtin.user:
    name: "{{ rux_admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    password_lock: true

- name: Install administrator SSH keys
  block:
    - name: Create the administrator SSH directory
      ansible.builtin.file:
        path: "/home/{{ rux_admin_user }}/.ssh"
        state: directory
        owner: "{{ rux_admin_user }}"
        group: "{{ rux_admin_user }}"
        mode: "0700"

    - name: Install the exclusive administrator authorized keys
      ansible.builtin.copy:
        dest: "/home/{{ rux_admin_user }}/.ssh/authorized_keys"
        content: "{{ rux_admin_authorized_keys | join('\n') }}\n"
        owner: "{{ rux_admin_user }}"
        group: "{{ rux_admin_user }}"
        mode: "0600"

- name: Allow passwordless provisioning sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ rux_admin_user }}"
    content: "{{ rux_admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install the registry SSH hardening policy
  ansible.builtin.template:
    src: sshd-rux-server.conf.j2
    dest: /etc/ssh/sshd_config.d/90-rux-server.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate and restart SSH

- name: Configure automatic Ubuntu security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52rux-server-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Create the journald override directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bound persistent journal storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-rux-server.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
      RuntimeMaxUse=256M
      MaxRetentionSec=30day
  notify: Restart journald

- name: Install the exact host firewall policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft --check --file %s
  notify: Validate and reload nftables

- name: Enable host security services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nftables
    - unattended-upgrades

- name: Report a required reboot without performing it
  ansible.builtin.stat:
    path: /run/reboot-required
  register: rux_reboot_required
  changed_when: false

- name: Warn when the operator must reboot
  ansible.builtin.debug:
    msg: The host requires an operator-scheduled reboot before production use.
  when: rux_reboot_required.stat.exists
