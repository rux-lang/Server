---
- name: Install PostgreSQL 18 from the Ubuntu archive
  ansible.builtin.apt:
    name: postgresql-18
    state: present

- name: Configure the PostgreSQL registry cluster
  ansible.builtin.template:
    src: postgresql-rux-server.conf.j2
    dest: /etc/postgresql/18/main/conf.d/rux-server.conf
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart PostgreSQL

- name: Enable and start PostgreSQL before database provisioning
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the application role exists
  community.postgresql.postgresql_query:
    login_db: postgres
    query: SELECT 1 FROM pg_roles WHERE rolname = %(role)s
    named_args:
      role: "{{ rux_database_user }}"
  become_user: postgres
  become: true
  register: rux_database_role_query
  changed_when: false

- name: Create the least-privileged application role
  community.postgresql.postgresql_user:
    login_db: postgres
    name: "{{ rux_database_user }}"
    password: "{{ rux_postgres_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOINHERIT,LOGIN,NOREPLICATION,NOBYPASSRLS
    state: present
  become_user: postgres
  become: true
  environment:
    PGOPTIONS: -c password_encryption=scram-sha-256
  when: rux_database_role_query.rowcount == 0
  no_log: true

- name: Create the registry database
  community.postgresql.postgresql_db:
    name: "{{ rux_database_name }}"
    owner: "{{ rux_database_user }}"
    encoding: UTF8
    template: template0
    state: present
  become_user: postgres
  become: true

- name: Install the exact PostgreSQL client authentication policy
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /etc/postgresql/18/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0640"
  notify: Restart PostgreSQL

- name: Apply PostgreSQL configuration before credential verification
  ansible.builtin.meta: flush_handlers

- name: Check the supplied application credential
  community.postgresql.postgresql_ping:
    login_host: 127.0.0.1
    login_db: "{{ rux_database_name }}"
    login_user: "{{ rux_database_user }}"
    login_password: "{{ rux_postgres_password }}"
  register: rux_database_ping
  failed_when: false
  changed_when: false
  no_log: true

- name: Rotate a changed application credential
  community.postgresql.postgresql_user:
    login_db: postgres
    name: "{{ rux_database_user }}"
    password: "{{ rux_postgres_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOINHERIT,LOGIN,NOREPLICATION,NOBYPASSRLS
    state: present
  become_user: postgres
  become: true
  environment:
    PGOPTIONS: -c password_encryption=scram-sha-256
  when: not rux_database_ping.is_available | default(false)
  no_log: true

- name: Verify the application can authenticate after convergence
  community.postgresql.postgresql_ping:
    login_host: 127.0.0.1
    login_db: "{{ rux_database_name }}"
    login_user: "{{ rux_database_user }}"
    login_password: "{{ rux_postgres_password }}"
  register: rux_database_final_ping
  failed_when: not rux_database_final_ping.is_available
  changed_when: false
  no_log: true
