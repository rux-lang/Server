---
- name: Install PostgreSQL recovery and metrics packages
  ansible.builtin.apt:
    name:
      - pgbackrest
      - prometheus-node-exporter
    state: present

- name: Stop the distribution node exporter service
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: false
    state: stopped

- name: Create PostgreSQL recovery directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/pgbackrest, owner: root, group: postgres, mode: "0750" }
    - { path: /var/log/pgbackrest, owner: postgres, group: postgres, mode: "0750" }
    - { path: /usr/local/libexec/rux-server, owner: root, group: root, mode: "0755" }
    - { path: /var/lib/rux-recovery, owner: postgres, group: prometheus, mode: "2750" }
    - { path: /var/lib/rux-recovery/metrics, owner: postgres, group: prometheus, mode: "2770" }

- name: Create the test-only local backup repository
  ansible.builtin.file:
    path: "{{ rux_backup_local_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: rux_backup_repo_type == 'posix'

- name: Render the encrypted pgBackRest repository configuration
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: root
    group: postgres
    mode: "0640"
  no_log: true

- name: Install recovery metric helpers
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../recovery/{{ item.source }}"
    dest: "{{ item.destination }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - source: run-pgbackrest.sh
      destination: /usr/local/libexec/rux-server/run-pgbackrest
    - source: collect-postgres-backup-metrics.sh
      destination: /usr/local/libexec/rux-server/collect-postgres-backup-metrics
    - source: record-rehearsal.sh
      destination: /usr/local/sbin/rux-record-recovery-rehearsal

- name: Install PostgreSQL recovery systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - rux-node-exporter.service
    - rux-pgbackrest-backup@.service
    - rux-pgbackrest-full.timer
    - rux-pgbackrest-diff.timer
    - rux-pgbackrest-check.service
    - rux-pgbackrest-check.timer
    - rux-postgres-backup-metrics.service
    - rux-postgres-backup-metrics.timer
  notify:
    - Reload systemd
    - Restart backup metrics exporter

- name: Apply PostgreSQL archive and recovery configuration
  ansible.builtin.meta: flush_handlers

- name: Create or validate the pgBackRest stanza
  ansible.builtin.command:
    argv:
      - /usr/bin/pgbackrest
      - --stanza=registry
      - stanza-create
  register: rux_pgbackrest_stanza
  become_user: postgres
  become: true
  changed_when: "'already exists' not in (rux_pgbackrest_stanza.stdout ~ rux_pgbackrest_stanza.stderr)"
  no_log: "{{ not rux_backup_test_mode | bool }}"

- name: Read available PostgreSQL backup sets
  ansible.builtin.command:
    argv:
      - /usr/bin/pgbackrest
      - --stanza=registry
      - --output=json
      - info
  register: rux_pgbackrest_info
  become_user: postgres
  become: true
  changed_when: false
  no_log: "{{ not rux_backup_test_mode | bool }}"

- name: Create the initial full PostgreSQL backup
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/rux-server/run-pgbackrest
      - backup
      - full
  become_user: postgres
  become: true
  when: (rux_pgbackrest_info.stdout | from_json | first).backup | length == 0
  changed_when: true
  no_log: "{{ not rux_backup_test_mode | bool }}"

- name: Enable PostgreSQL recovery schedules and metrics
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - rux-node-exporter.service
    - rux-pgbackrest-full.timer
    - rux-pgbackrest-diff.timer
    - rux-pgbackrest-check.timer
    - rux-postgres-backup-metrics.timer

- name: Collect initial PostgreSQL WAL archive metrics
  ansible.builtin.command: /usr/local/libexec/rux-server/collect-postgres-backup-metrics
  become_user: postgres
  become: true
  changed_when: false
