---
- name: Create the API service account
  ansible.builtin.user:
    name: rux-server
    system: true
    home: /var/lib/rux-server
    create_home: false
    shell: /usr/sbin/nologin
    password_lock: true

- name: Create registry runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /srv/rux-server, owner: root, group: root, mode: "0755" }
    - { path: /srv/rux-server/releases, owner: root, group: root, mode: "0755" }
    - { path: /srv/rux-server/shared, owner: root, group: rux-server, mode: "0750" }
    - { path: /var/lib/rux-server, owner: rux-server, group: rux-server, mode: "0750" }
    - { path: /var/lib/rux-server/uploads, owner: rux-server, group: rux-server, mode: "0700" }
    - { path: /etc/rux-server, owner: root, group: rux-server, mode: "0750" }

- name: Render the root-owned API environment
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/rux-server/api.env
    owner: root
    group: rux-server
    mode: "0640"
  no_log: true
  notify: Reload systemd

- name: Install the hardened API systemd unit
  ansible.builtin.template:
    src: rux-server.service.j2
    dest: /etc/systemd/system/rux-server.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable the release-owned API service without changing its release state
  ansible.builtin.systemd_service:
    name: rux-server
    enabled: true
    daemon_reload: true
