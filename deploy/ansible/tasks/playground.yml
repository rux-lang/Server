---
# The playground executes submitted code in a throwaway container. Docker's
# socket is root-equivalent, so the process that reaches it runs as its own
# service user in the docker group, and the registry keeps the hardening in
# templates/rux-server.service.j2 untouched. See templates/rux-playground.service.j2.

- name: Install the Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /usr/share/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the official Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /usr/share/keyrings/docker.asc
    state: present

- name: Install the pinned container runtime
  ansible.builtin.apt:
    name:
      - "docker-ce={{ playground_docker_version }}"
      - "docker-ce-cli={{ playground_docker_version }}"
      - "containerd.io={{ playground_containerd_version }}"
    state: present
    update_cache: true

- name: Hold the reviewed container runtime versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io

- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker daemon policy
  ansible.builtin.template:
    src: docker-daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/python3 -c "import json,sys; json.load(open(sys.argv[1]))" %s
  notify: Restart Docker

- name: Create the Docker service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Redundant while the daemon policy keeps "iptables" false, but it costs nothing
# and it is what makes flipping that flag back on safe: the host firewall is
# fully loaded before the daemon has a chance to add rules of its own.
- name: Order Docker after the host firewall
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-rux-nftables.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      After=nftables.service
      Wants=nftables.service
  notify:
    - Reload systemd
    - Restart Docker

- name: Apply Docker configuration before the daemon is used
  ansible.builtin.meta: flush_handlers

- name: Enable the container runtime
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
    daemon_reload: true

- name: Create the playground service account
  ansible.builtin.user:
    name: rux-playground
    system: true
    home: "{{ playground_state_root }}"
    create_home: false
    shell: /usr/sbin/nologin
    password_lock: true
    groups: docker
    append: true

# The daemon chmods its socket 0660; a shared group is how the registry reaches
# it without any docker access of its own.
- name: Allow the registry to reach the playground socket
  ansible.builtin.user:
    name: rux-server
    groups: rux-playground
    append: true

- name: Create playground runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ playground_state_root }}", owner: rux-playground, group: rux-playground, mode: "0750" }
    - { path: "{{ playground_jobs_root }}", owner: rux-playground, group: rux-playground, mode: "0700" }
    - { path: /etc/rux-playground, owner: root, group: rux-playground, mode: "0750" }
    - { path: "{{ playground_runtime_directory }}", owner: rux-playground, group: rux-playground, mode: "0750" }

# /run is a tmpfs, so the directory created above does not survive a reboot and
# the broker must not be the thing that creates it: the registry's unit lists it
# read-write and would fail to start if it were missing.
- name: Recreate the playground runtime directory on boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/rux-playground.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      d {{ playground_runtime_directory }} 0750 rux-playground rux-playground -

- name: Stage the sandbox image build context
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../playground/"
    dest: /usr/local/lib/rux-playground/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Check whether the pinned sandbox image is present
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - image
      - inspect
      - "rux-playground:{{ playground_rux_version }}"
  register: playground_image
  changed_when: false
  failed_when: false

# The build verifies the compiler tarball against playground_rux_sha256 and is
# the only step here that needs the network. Adding a standard package to the
# allowlist means rebuilding, because --network=none forbids resolving one at
# request time.
- name: Build the pinned sandbox image
  ansible.builtin.command:
    argv:
      - /bin/bash
      - /usr/local/lib/rux-playground/build-image.sh
      - "{{ playground_rux_version }}"
      - "{{ playground_rux_sha256 }}"
      - "{{ playground_packages }}"
    chdir: /usr/local/lib/rux-playground
  when:
    - playground_build_image | bool
    - playground_image.rc != 0
  changed_when: true

- name: Render the root-owned playground environment
  ansible.builtin.template:
    src: playground.env.j2
    dest: /etc/rux-playground/playground.env
    owner: root
    group: rux-playground
    mode: "0640"
  notify: Reload systemd

- name: Install the playground systemd unit
  ansible.builtin.template:
    src: rux-playground.service.j2
    dest: /etc/systemd/system/rux-playground.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# Enabled but not started, exactly like rux-server: ExecStart lives in the
# release directory, so the release playbook is what first brings it up.
- name: Enable the release-owned playground service without starting it
  ansible.builtin.systemd_service:
    name: rux-playground
    enabled: true
    daemon_reload: true
