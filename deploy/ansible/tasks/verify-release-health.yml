---
- name: Wait for the candidate API to become ready
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/health/ready
    method: GET
    status_code: 200
    return_content: true
  register: rux_release_readiness
  until:
    - rux_release_readiness.status == 200
    - rux_release_readiness.json.status | default('') == 'healthy'
  retries: "{{ rux_release_health_retries }}"
  delay: "{{ rux_release_health_delay_seconds }}"
  changed_when: false

- name: Verify the candidate service is active
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - --quiet
      - rux-server.service
  changed_when: false

- name: Verify the public API through Caddy
  ansible.builtin.command:
    argv:
      - /usr/bin/curl
      - --fail
      - --silent
      - --show-error
      - --resolve
      - "{{ rux_api_address }}:443:127.0.0.1"
      - "https://{{ rux_api_address }}/openapi/v1.json"
  changed_when: false
  when: rux_release_verify_public | bool
