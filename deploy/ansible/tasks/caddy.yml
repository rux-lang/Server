---
- name: Install the Caddy repository signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the official stable Caddy repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: [deb]
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: [any-version]
    components: [main]
    architectures: [amd64]
    signed_by: /usr/share/keyrings/caddy-stable.asc
    state: present

- name: Install the pinned Caddy package
  ansible.builtin.apt:
    name: "caddy={{ rux_caddy_version }}"
    state: present
    update_cache: true

- name: Hold the reviewed Caddy version
  ansible.builtin.dpkg_selections:
    name: caddy
    selection: hold

- name: Create the Caddy service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Caddy deployment paths and addresses
  ansible.builtin.template:
    src: caddy.env.j2
    dest: /etc/caddy/rux-server.env
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Validate and reload Caddy

- name: Load the registry Caddy environment
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/10-rux-server.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      EnvironmentFile=/etc/caddy/rux-server.env
  notify:
    - Reload systemd
    - Validate and reload Caddy

- name: Install the versioned registry Caddyfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../caddy/Caddyfile"
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
  notify: Validate and reload Caddy

- name: Apply Caddy configuration before service verification
  ansible.builtin.meta: flush_handlers

- name: Enable Caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
