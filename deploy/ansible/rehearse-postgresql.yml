---
- name: Rehearse Rux Server PostgreSQL recovery on a disposable host
  hosts: recovery
  become: true
  gather_facts: true
  vars:
    rux_recovery_confirm_disposable: false
    rux_recovery_target_time: ""
    rux_recovery_evidence_directory: /secure/recovery-rehearsals

  tasks:
    - name: Require the supported disposable recovery host
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version is version('26.04', '==')
          - ansible_facts.architecture == 'x86_64'
          - rux_recovery_confirm_disposable | bool
          - rux_backup_repo_type == 's3'
          - not rux_backup_test_mode | bool
          - rux_recovery_evidence_directory is match('^/')
        fail_msg: Recovery rehearsals require a confirmed disposable Ubuntu 26.04 host and the production S3 backup repository.

    - name: Check the out-of-band disposable-host marker
      ansible.builtin.stat:
        path: /etc/rux-disposable-recovery-host
      register: rux_recovery_marker

    - name: Refuse an unmarked recovery host
      ansible.builtin.assert:
        that:
          - rux_recovery_marker.stat.isreg | default(false)
        fail_msg: Create /etc/rux-disposable-recovery-host through the disposable host bootstrap before running this playbook.

    - name: Install PostgreSQL recovery packages
      ansible.builtin.apt:
        name:
          - pgbackrest
          - postgresql-18
          - python3-psycopg2
        state: present
        update_cache: true

    - name: Create the pgBackRest configuration directory
      ansible.builtin.file:
        path: /etc/pgbackrest
        state: directory
        owner: root
        group: postgres
        mode: "0750"

    - name: Render read-only recovery repository configuration
      ansible.builtin.template:
        src: pgbackrest.conf.j2
        dest: /etc/pgbackrest/pgbackrest.conf
        owner: root
        group: postgres
        mode: "0640"
      no_log: true

    - name: Record rehearsal start time
      ansible.builtin.command: /usr/bin/date +%s
      register: rux_recovery_started_at
      changed_when: false

    - name: Stop the empty PostgreSQL recovery cluster
      ansible.builtin.systemd_service:
        name: postgresql
        state: stopped

    - name: Remove only the confirmed disposable PostgreSQL data directory
      ansible.builtin.file:
        path: /var/lib/postgresql/18/main
        state: absent

    - name: Restore the latest recoverable PostgreSQL state
      ansible.builtin.command:
        argv:
          - /usr/bin/pgbackrest
          - --stanza=registry
          - --archive-mode=off
          - restore
      become_user: postgres
      become: true
      when: rux_recovery_target_time | length == 0
      changed_when: true
      no_log: true

    - name: Restore PostgreSQL to the selected point in time
      ansible.builtin.command:
        argv:
          - /usr/bin/pgbackrest
          - --stanza=registry
          - --archive-mode=off
          - --type=time
          - "--target={{ rux_recovery_target_time }}"
          - --target-action=promote
          - restore
      become_user: postgres
      become: true
      when: rux_recovery_target_time | length > 0
      changed_when: true
      no_log: true

    - name: Start the restored PostgreSQL cluster
      ansible.builtin.systemd_service:
        name: postgresql
        state: started

    - name: Wait for the restored cluster to accept connections
      ansible.builtin.command:
        argv:
          - /usr/bin/pg_isready
          - --dbname={{ rux_database_name }}
      register: rux_recovery_ready
      retries: 30
      delay: 2
      until: rux_recovery_ready.rc == 0
      changed_when: false

    - name: Validate restored registry invariants
      community.postgresql.postgresql_query:
        login_db: "{{ rux_database_name }}"
        query: |
          SELECT
            (SELECT count(*) FROM _sqlx_migrations WHERE success) AS successful_migrations,
            (SELECT count(*) FROM package_versions) AS package_versions,
            (SELECT count(*) FROM package_versions WHERE octet_length(artifact_sha256) <> 32) AS invalid_checksums,
            (SELECT count(*) FROM packages p LEFT JOIN namespaces n ON n.id = p.namespace_id WHERE n.id IS NULL) AS orphan_packages;
      become_user: postgres
      become: true
      register: rux_recovery_validation
      failed_when: >-
        rux_recovery_validation.query_result[0].successful_migrations | int == 0 or
        rux_recovery_validation.query_result[0].invalid_checksums | int != 0 or
        rux_recovery_validation.query_result[0].orphan_packages | int != 0

    - name: Record rehearsal completion time
      ansible.builtin.command: /usr/bin/date +%s
      register: rux_recovery_finished_at
      changed_when: false

    - name: Write PostgreSQL recovery evidence on the disposable host
      ansible.builtin.copy:
        dest: /var/tmp/rux-postgresql-recovery-evidence.json
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{ {
            'schema_version': 1,
            'target': 'postgresql',
            'outcome': 'success',
            'recovery_target_time': rux_recovery_target_time | default('latest', true),
            'started_at': rux_recovery_started_at.stdout | int,
            'finished_at': rux_recovery_finished_at.stdout | int,
            'duration_seconds': (rux_recovery_finished_at.stdout | int) - (rux_recovery_started_at.stdout | int),
            'validation': rux_recovery_validation.query_result[0]
          } | to_nice_json }}

    - name: Fetch PostgreSQL recovery evidence to the controller
      ansible.builtin.fetch:
        src: /var/tmp/rux-postgresql-recovery-evidence.json
        dest: "{{ rux_recovery_evidence_directory }}/postgresql-{{ inventory_hostname }}.json"
        flat: true
