---
rux_admin_user: rux-admin
rux_admin_authorized_keys: []
rux_ssh_port: 22
rux_ssh_allowed_cidrs: []

rux_api_address: api.rux-lang.dev
rux_caddy_api_address: "{{ rux_api_address }}"
rux_api_upstream: 127.0.0.1:8080
rux_allowed_web_origin: https://rux-lang.dev
rux_web_callback_url: https://rux-lang.dev/packages/-/auth/callback
rux_github_callback_url: https://api.rux-lang.dev/v1/auth/github/callback

rux_database_name: registry
rux_database_user: rux_server
rux_backup_repo_type: s3
rux_backup_test_mode: false
rux_backup_endpoint: https://nyc3.digitaloceanspaces.com
rux_backup_bucket: rux-postgres-backups
rux_backup_region: nyc3
rux_backup_repo_path: /postgresql
rux_backup_local_path: /var/lib/pgbackrest/repository
rux_storage_endpoint: https://fra1.digitaloceanspaces.com
rux_storage_bucket: packages
rux_storage_region: fra1
rux_storage_force_path_style: false
rux_package_cdn_base_url: https://packages.fra1.cdn.digitaloceanspaces.com/

rux_request_timeout_seconds: 30
rux_publication_timeout_seconds: 120
rux_rate_limit_read_per_minute: 120
rux_rate_limit_read_burst: 60
rux_rate_limit_security_per_minute: 30
rux_rate_limit_security_burst: 10
rux_rate_limit_mutation_per_minute: 60
rux_rate_limit_mutation_burst: 20
rux_rate_limit_publication_per_minute: 6
rux_rate_limit_publication_burst: 2
rux_upload_max_concurrency: 8
rux_upload_temporary_capacity_bytes: 104857600
rux_dependency_probe_interval_seconds: 15
rux_rust_log: info,rux_server=info

rux_prometheus_version: 3.13.0
rux_prometheus_checksum: 744d93324cc024d82089921737bd797474d7f1e5dbbfd1c6b387bad258538cb9
rux_prometheus_retention_time: 30d
rux_prometheus_retention_size: 5GB
rux_alertmanager_version: 0.32.1
rux_alertmanager_checksum: e3ba4a543111dd4bbf436838385cbf88108f0b128a723e61fe97d3569294ad4d
rux_grafana_version: 13.1.0
rux_caddy_version: 2.11.4

# Required secrets must be supplied from an untracked or Ansible Vault file.
rux_postgres_password: ""
rux_storage_access_key: ""
rux_storage_secret_key: ""
rux_github_client_id: ""
rux_github_client_secret: ""
rux_grafana_admin_password: ""
rux_alert_warning_webhook_url: ""
rux_alert_critical_webhook_url: ""
rux_backup_access_key: ""
rux_backup_secret_key: ""
rux_backup_cipher_passphrase: ""
