name: Supply Chain

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable Git ref to inspect
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          license-check: true
          allow-licenses: >-
            0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
            BSD-3-Clause, BlueOak-1.0.0, BSL-1.0, CC-BY-3.0, CC-BY-4.0,
            CC0-1.0, CDLA-Permissive-2.0, ISC, MIT, MIT-0, MPL-2.0,
            Python-2.0, Unicode-3.0, Unlicense, Zlib
          show-patched-versions: true

  vulnerabilities:
    name: Rust vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out inspected ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Rust
        run: rustup show
      - name: Cache Cargo audit build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .supply-chain-tools
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install pinned Cargo audit
        run: |
          if [[ ! -x .supply-chain-tools/bin/cargo-audit ]]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked \
              --root .supply-chain-tools
          fi
          echo "$PWD/.supply-chain-tools/bin" >> "$GITHUB_PATH"
      - name: Audit Rust dependencies
        shell: bash
        run: |
          set +e
          .supply-chain-tools/bin/cargo-audit audit --file Cargo.lock --json \
            > "$RUNNER_TEMP/cargo-audit.json"
          audit_status=$?
          set -e
          if (( audit_status > 1 )); then
            echo "cargo-audit exited unexpectedly with status $audit_status" >&2
            exit "$audit_status"
          fi
          node scripts/supply-chain/check-cargo-audit.mjs \
            "$RUNNER_TEMP/cargo-audit.json"
  rust-licenses-and-sources:
    name: Rust licenses and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out inspected ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Enforce Cargo policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features
          command: check
          command-arguments: licenses sources

  secrets:
    name: Secret history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full reachable history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_root="$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          install -d -m 0755 "$install_root"
          tar -xzf "$archive" -C "$install_root" gitleaks
          chmod 0755 "$install_root/gitleaks"
      - name: Scan Git history with redacted output
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git
          --no-banner
          --redact=100
          --verbose
          "$GITHUB_WORKSPACE"
