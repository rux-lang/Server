name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with playground_rux_version / playground_rux_sha256 in
  # deploy/ansible/group_vars/all.yml. The build refuses to run without the
  # checksum: it downloads a compiler tarball, and an unverified download is the
  # one step of the sandbox design a network attacker could turn into arbitrary
  # code execution inside every later run.
  PLAYGROUND_RUX_VERSION: "0.3.0"
  PLAYGROUND_RUX_SHA256: 82e654f9ced042dc029220836d1322b208790099627f32efd9d8d600834be5cc

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/registry
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        run: rustup show
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build release
        run: cargo build --workspace --release

  provisioning:
    name: Production provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: deploy/ansible/requirements.txt
      - name: Install provisioning test dependencies
        run: pip install --requirement deploy/ansible/requirements.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install --requirements-file deploy/ansible/requirements.yml
      - name: Lint provisioning code
        run: ansible-lint deploy/ansible
      - name: Verify recovery scripts
        run: bash deploy/recovery/test-recovery-scripts.sh
      - name: Verify immutable release packaging
        run: bash deploy/release/test-release.sh
      - name: Verify provisioning convergence and idempotence
        working-directory: deploy/ansible
        run: molecule test
      - name: Verify release deployment and rollback
        working-directory: deploy/ansible
        run: molecule test --scenario-name release

  performance-smoke:
    name: Performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://registry:registry@localhost:5432/registry_performance
      POSTGRES_DB: registry_performance
      RUX_BIND_ADDRESS: 127.0.0.1:8080
      RUX_DATABASE_URL: postgres://registry:registry@localhost:5432/registry_performance
      RUX_STORAGE_ENDPOINT: http://localhost:9000
      RUX_STORAGE_BUCKET: packages
      RUX_STORAGE_ACCESS_KEY: registry
      RUX_STORAGE_SECRET_KEY: registry-secret
      RUX_STORAGE_REGION: us-east-1
      RUX_STORAGE_FORCE_PATH_STYLE: "true"
      RUX_PACKAGE_CDN_BASE_URL: http://localhost:9000/packages/
      RUX_ALLOWED_WEB_ORIGIN: http://localhost:3000
      RUX_WEB_CALLBACK_URL: http://localhost:3000/packages/-/auth/callback
      RUX_GITHUB_CLIENT_ID: performance-smoke-client
      RUX_GITHUB_CLIENT_SECRET: performance-smoke-secret
      RUX_GITHUB_CALLBACK_URL: http://localhost:8080/v1/auth/github/callback
      RUX_RATE_LIMIT_READ_PER_MINUTE: 10000
      RUX_RATE_LIMIT_READ_BURST: 500
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        run: rustup show
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: performance-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: performance-cargo-${{ runner.os }}-
      - name: Start isolated dependencies
        run: docker compose up -d --wait --wait-timeout 90
      - name: Prepare smoke catalog and publication fixtures
        run: |
          mkdir -p .performance/fixtures .performance/results
          cargo run -p rux-performance -- migrate smoke > .performance/results/migrate.json
          cargo run -p rux-performance -- seed smoke > .performance/results/seed.json
          cargo run -p rux-performance -- fixtures smoke .performance/fixtures "ci-${GITHUB_RUN_ID}" > .performance/results/fixtures.json
          cargo run -p rux-performance -- size smoke > .performance/results/database-size.json
      - name: Start release API
        run: |
          cargo run -p rux-server --release > .performance/api.log 2>&1 &
          echo $! > .performance/api.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat .performance/api.log
          exit 1
      - name: Exercise performance scenarios
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts/performance:/scripts:ro" \
            -v "$PWD/.performance:/work" \
            grafana/k6:1.5.0 run --summary-export /work/results/api.json \
            -e RUX_PERFORMANCE_PROFILE=smoke \
            -e RUX_PERFORMANCE_API_BASE_URL=http://127.0.0.1:8080 \
            /scripts/api.js
          docker run --rm --network host \
            -v "$PWD/scripts/performance:/scripts:ro" \
            -v "$PWD/.performance:/work" \
            grafana/k6:1.5.0 run --summary-export /work/results/publication.json \
            -e RUX_PERFORMANCE_PROFILE=smoke \
            -e RUX_PERFORMANCE_API_BASE_URL=http://127.0.0.1:8080 \
            -e RUX_PERFORMANCE_FIXTURES=/work/fixtures \
            /scripts/publication.js
      - name: Upload performance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-performance-smoke
          path: |
            .performance/results
            .performance/api.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated dependencies
        if: ${{ always() }}
        run: |
          if test -f .performance/api.pid; then kill "$(cat .performance/api.pid)" 2>/dev/null || true; fi
          docker compose down --volumes

  playground:
    name: Playground sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the pinned sandbox image
        run: bash deploy/playground/build-image.sh "$PLAYGROUND_RUX_VERSION" "$PLAYGROUND_RUX_SHA256"
      # Asserts that a specific containment mechanism stopped each fixture - the
      # compile timeout, the pid limit, the memory limit, the dropped network,
      # the output cap, the framing - because a sandbox that merely refused
      # everything would pass a success-only suite.
      - name: Verify sandbox containment
        run: bash deploy/playground/test-image.sh "rux-playground:$PLAYGROUND_RUX_VERSION"

  smoke:
    name: Integration smoke
    needs: [rust, provisioning, performance-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUX_BIND_ADDRESS: 127.0.0.1:8080
      RUX_DATABASE_URL: postgres://registry:registry@localhost:5432/registry
      RUX_STORAGE_ENDPOINT: http://localhost:9000
      RUX_STORAGE_BUCKET: packages
      RUX_STORAGE_ACCESS_KEY: registry
      RUX_STORAGE_SECRET_KEY: registry-secret
      RUX_STORAGE_REGION: us-east-1
      RUX_STORAGE_FORCE_PATH_STYLE: "true"
      RUX_ALLOWED_WEB_ORIGIN: http://localhost:3000
      RUX_WEB_CALLBACK_URL: http://localhost:3000/packages/-/auth/callback
      RUX_GITHUB_CLIENT_ID: smoke-test-client
      RUX_GITHUB_CLIENT_SECRET: smoke-test-secret
      RUX_GITHUB_CALLBACK_URL: http://localhost:8080/v1/auth/github/callback
      RUX_METRICS_BIND_ADDRESS: 0.0.0.0:9464
      RUX_METRICS_ALLOW_NON_LOOPBACK: "true"
      RUX_PLAYGROUND_ENABLED: "true"
      RUX_PLAYGROUND_SOCKET: ${{ github.workspace }}/playground.sock
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Start dependencies
        run: docker compose up -d --wait --wait-timeout 90
      - name: Validate observability configuration
        run: |
          docker compose --profile observability config --quiet
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/observability:/work:ro" -w /work \
            prom/prometheus:v3.5.0 test rules alerts.test.yml
      # Rebuilt here rather than shared from the playground job: moving a ~200 MB
      # image between jobs costs more than building it again, and the two jobs
      # then stay independent.
      - name: Build the pinned sandbox image
        run: bash deploy/playground/build-image.sh "$PLAYGROUND_RUX_VERSION" "$PLAYGROUND_RUX_SHA256"
      # Started before the API so the availability watcher finds it on its first
      # probe. The broker is the only process here that reaches Docker.
      - name: Start the playground broker
        run: |
          export RUX_PLAYGROUND_IMAGE="rux-playground:${PLAYGROUND_RUX_VERSION}"
          export RUX_PLAYGROUND_JOBS_ROOT="${GITHUB_WORKSPACE}/playground-jobs"
          mkdir -p "$RUX_PLAYGROUND_JOBS_ROOT"
          cargo run -p rux-server --bin rux-playgroundd > playgroundd.log 2>&1 &
          echo $! > playgroundd.pid
          for _ in {1..90}; do
            if test -S "$RUX_PLAYGROUND_SOCKET"; then
              exit 0
            fi
            sleep 2
          done
          cat playgroundd.log
          exit 1
      - name: Start API
        run: |
          cargo run -p rux-server > api.log 2>&1 &
          echo $! > api.pid
      - name: Wait for API
        run: |
          for _ in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/ready > ready.json; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1
      - name: Verify object-storage upload contract
        run: cargo test -p rux-infrastructure --test object_storage -- --ignored
      - name: Verify API contracts
        run: |
          curl --fail --silent http://localhost:8080/health/live | grep '"status":"healthy"'
          grep '"status":"healthy"' ready.json
          grep '"postgresql"' ready.json
          grep '"object_storage"' ready.json
          curl --fail --silent http://localhost:8080/openapi/v1.json | grep '"openapi"'
      # End to end through every hop: HTTP handler, unix socket, broker, and a
      # real container. The program returns an exit code rather than printing,
      # because a program that prints has to import Io and the registry the
      # released compiler resolves packages from does not exist yet, so nothing
      # can be seeded into the image. Swap this for a hello-world stdout
      # assertion once seeding works; see docs/playground.md.
      - name: Verify the playground contract
        run: |
          ran=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/v1/playground/run \
            --header 'content-type: application/json' \
            --header "origin: $RUX_ALLOWED_WEB_ORIGIN" \
            --data '{"mode":"run","profile":"debug","source":"func Main() -> int {\n    return 0;\n}\n"}')
          echo "$ran"
          echo "$ran" | jq -e '.data.build.success == true' > /dev/null
          echo "$ran" | jq -e '.data.program.exit_code == 0' > /dev/null
          echo "$ran" | jq -e '.data.program.timed_out == false' > /dev/null
          # A failed compile is a 200 with diagnostics, never a problem document.
          broken=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/v1/playground/run \
            --header 'content-type: application/json' \
            --header "origin: $RUX_ALLOWED_WEB_ORIGIN" \
            --data '{"mode":"build","source":"func Main( -> int {}\n"}')
          echo "$broken" | jq -e '.data.build.success == false' > /dev/null
          echo "$broken" | jq -e '.data.build.diagnostics | length > 0' > /dev/null
          # Anonymous and executes code, so a missing Origin must be refused.
          origin_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://localhost:8080/v1/playground/run \
            --header 'content-type: application/json' \
            --data '{"mode":"build","source":"func Main() -> int {\n    return 0;\n}\n"}')
          test "$origin_status" = "403"
          curl --fail --silent http://localhost:8080/v1/playground/limits \
            | jq -e '.data.max_source_bytes == 32768' > /dev/null
      - name: Verify observability stack
        run: |
          docker compose --profile observability up -d --wait --wait-timeout 120 prometheus grafana
          for attempt in {1..30}; do
            if curl --fail --silent --get \
              --data-urlencode 'query=up{job="rux-server"}' \
              http://127.0.0.1:9090/api/v1/query | grep -q '"value"'; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose --profile observability logs prometheus grafana
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3001/api/health | grep '"database"'
          curl --fail --silent \
            http://127.0.0.1:3001/api/dashboards/uid/rux-server-overview \
            | grep '"uid":"rux-server-overview"'
      - name: Upload API log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-api-log
          path: api.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload playground broker log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-playgroundd-log
          path: playgroundd.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the playground broker
        if: ${{ always() }}
        run: |
          if test -f playgroundd.pid; then kill "$(cat playgroundd.pid)" 2>/dev/null || true; fi
      - name: Stop dependencies
        if: ${{ always() }}
        run: docker compose down --volumes
