name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # Release.yml runs these same three jobs against the tagged commit rather than
  # a copy that could drift from them. Nothing else about this file changes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with the pinned compiler recorded in docs/playground.md. The
  # build refuses to run without the checksum: it downloads a compiler tarball,
  # and an unverified download is the one step of the sandbox design a network
  # attacker could turn into arbitrary code execution inside every later run.
  PLAYGROUND_RUX_VERSION: "0.3.0"
  PLAYGROUND_RUX_SHA256: 82e654f9ced042dc029220836d1322b208790099627f32efd9d8d600834be5cc
  # Kept in step with the versions documented for local development.
  MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
  MINIO_MC_VERSION: RELEASE.2025-08-13T08-35-41Z

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/registry
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build release
        run: cargo build --workspace --release

  playground:
    name: Playground sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the pinned sandbox image
        run: bash playground/build-image.sh "$PLAYGROUND_RUX_VERSION" "$PLAYGROUND_RUX_SHA256"
      # Asserts that a specific containment mechanism stopped each fixture - the
      # compile timeout, the pid limit, the memory limit, the dropped network,
      # the output cap, the framing - because a sandbox that merely refused
      # everything would pass a success-only suite.
      - name: Verify sandbox containment
        run: bash playground/test-image.sh "rux-playground:$PLAYGROUND_RUX_VERSION"

  smoke:
    name: Integration smoke
    needs: [rust, playground]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configuration reaches both binaries through config/config.toml, written
    # below. These are only the values the shell steps also need - MinIO's
    # credentials, the origin header, the socket to wait on - so the prefix
    # keeps anyone from reading them as server configuration.
    env:
      SMOKE_DATABASE_URL: postgres://registry:registry@localhost:5432/registry
      SMOKE_STORAGE_ENDPOINT: http://localhost:9000
      SMOKE_STORAGE_BUCKET: packages
      SMOKE_STORAGE_ACCESS_KEY: registry
      SMOKE_STORAGE_SECRET_KEY: registry-secret
      SMOKE_WEB_ORIGIN: http://localhost:3000
      SMOKE_SOCKET: ${{ github.workspace }}/playground.sock
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Replaces the committed development copy in place rather than passing
      # --config, so this job exercises the default path. Written in full so
      # the smoke run does not drift when the development config is edited.
      - name: Write the server configuration
        run: |
          mkdir -p config "${GITHUB_WORKSPACE}/playground-jobs"
          cat > config/config.toml <<TOML
          [server]
          bind_address = "127.0.0.1:8080"

          [database]
          url = "${SMOKE_DATABASE_URL}"

          [storage]
          endpoint = "${SMOKE_STORAGE_ENDPOINT}"
          bucket = "${SMOKE_STORAGE_BUCKET}"
          access_key = "${SMOKE_STORAGE_ACCESS_KEY}"
          secret_key = "${SMOKE_STORAGE_SECRET_KEY}"
          region = "us-east-1"
          force_path_style = true

          [packages]
          cdn_base_url = "${SMOKE_STORAGE_ENDPOINT}/${SMOKE_STORAGE_BUCKET}/"

          [web]
          allowed_origin = "${SMOKE_WEB_ORIGIN}"
          callback_url = "${SMOKE_WEB_ORIGIN}/packages/-/auth/callback"

          [github]
          client_id = "smoke-test-client"
          client_secret = "smoke-test-secret"
          callback_url = "http://localhost:8080/v1/auth/github/callback"

          [playground]
          socket = "${SMOKE_SOCKET}"

          [playground.api]
          enabled = true

          [playground.broker]
          image = "rux-playground:${PLAYGROUND_RUX_VERSION}"
          jobs_root = "${GITHUB_WORKSPACE}/playground-jobs"
          TOML
          cat config/config.toml
      # Run natively rather than in a container, the same way local development
      # does, so the only container runtime this job needs is the sandbox's.
      - name: Start MinIO
        run: |
          mkdir -p .minio/data
          curl --fail --silent --show-error --location \
            --output .minio/minio \
            "https://dl.min.io/server/minio/release/linux-amd64/archive/minio.${MINIO_VERSION}"
          curl --fail --silent --show-error --location \
            --output .minio/mc \
            "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.${MINIO_MC_VERSION}"
          chmod +x .minio/minio .minio/mc
          MINIO_ROOT_USER="$SMOKE_STORAGE_ACCESS_KEY" \
          MINIO_ROOT_PASSWORD="$SMOKE_STORAGE_SECRET_KEY" \
            .minio/minio server .minio/data --address 127.0.0.1:9000 > .minio/minio.log 2>&1 &
          echo $! > .minio/minio.pid
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          .minio/mc alias set local "$SMOKE_STORAGE_ENDPOINT" \
            "$SMOKE_STORAGE_ACCESS_KEY" "$SMOKE_STORAGE_SECRET_KEY"
          .minio/mc mb --ignore-existing "local/$SMOKE_STORAGE_BUCKET"
          # Publication relies on versioned objects, and the orphan sweep lists
          # and deletes specific versions.
          .minio/mc version enable "local/$SMOKE_STORAGE_BUCKET"
      # Rebuilt here rather than shared from the playground job: moving a ~200 MB
      # image between jobs costs more than building it again, and the two jobs
      # then stay independent.
      - name: Build the pinned sandbox image
        run: bash playground/build-image.sh "$PLAYGROUND_RUX_VERSION" "$PLAYGROUND_RUX_SHA256"
      # The broker is the only process here that reaches Docker. It reads the
      # same config/config.toml the API does, from [playground.broker].
      - name: Start the playground broker
        run: |
          cargo run -p rux-server --bin rux-playgroundd > playgroundd.log 2>&1 &
          echo $! > playgroundd.pid
          for _ in {1..90}; do
            if test -S "$SMOKE_SOCKET"; then
              exit 0
            fi
            sleep 2
          done
          cat playgroundd.log
          exit 1
      - name: Start API
        run: |
          cargo run -p rux-server > api.log 2>&1 &
          echo $! > api.pid
      - name: Wait for API
        run: |
          for _ in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/ready > ready.json; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1
      # This test is not the server, so its inputs stay on the environment: it
      # runs with the working directory at the package root, where the default
      # config path does not resolve.
      - name: Verify object-storage upload contract
        env:
          RUX_DATABASE_URL: ${{ env.SMOKE_DATABASE_URL }}
          RUX_STORAGE_ENDPOINT: ${{ env.SMOKE_STORAGE_ENDPOINT }}
          RUX_STORAGE_BUCKET: ${{ env.SMOKE_STORAGE_BUCKET }}
          RUX_STORAGE_ACCESS_KEY: ${{ env.SMOKE_STORAGE_ACCESS_KEY }}
          RUX_STORAGE_SECRET_KEY: ${{ env.SMOKE_STORAGE_SECRET_KEY }}
          RUX_STORAGE_REGION: us-east-1
          RUX_STORAGE_FORCE_PATH_STYLE: "true"
        run: cargo test -p rux-infrastructure --test object_storage -- --ignored
      - name: Verify API contracts
        run: |
          curl --fail --silent http://localhost:8080/health/live | grep '"status":"healthy"'
          grep '"status":"healthy"' ready.json
          grep '"postgresql"' ready.json
          grep '"object_storage"' ready.json
          curl --fail --silent http://localhost:8080/openapi/v1.json | grep '"openapi"'
      # End to end through every hop: HTTP handler, unix socket, broker, and a
      # real container. The program returns an exit code rather than printing,
      # because a program that prints has to import Io and the registry the
      # released compiler resolves packages from does not exist yet, so nothing
      # can be seeded into the image. Swap this for a hello-world stdout
      # assertion once seeding works; see docs/playground.md.
      - name: Verify the playground contract
        run: |
          ran=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/v1/playground/run \
            --header 'content-type: application/json' \
            --header "origin: $SMOKE_WEB_ORIGIN" \
            --data '{"mode":"run","profile":"debug","source":"func Main() -> int {\n    return 0;\n}\n"}')
          echo "$ran"
          echo "$ran" | jq -e '.data.build.success == true' > /dev/null
          echo "$ran" | jq -e '.data.program.exit_code == 0' > /dev/null
          echo "$ran" | jq -e '.data.program.timed_out == false' > /dev/null
          # A failed compile is a 200 with diagnostics, never a problem document.
          broken=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/v1/playground/run \
            --header 'content-type: application/json' \
            --header "origin: $SMOKE_WEB_ORIGIN" \
            --data '{"mode":"build","source":"func Main( -> int {}\n"}')
          echo "$broken" | jq -e '.data.build.success == false' > /dev/null
          echo "$broken" | jq -e '.data.build.diagnostics | length > 0' > /dev/null
          # Anonymous and executes code, so a missing Origin must be refused.
          origin_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://localhost:8080/v1/playground/run \
            --header 'content-type: application/json' \
            --data '{"mode":"build","source":"func Main() -> int {\n    return 0;\n}\n"}')
          test "$origin_status" = "403"
          curl --fail --silent http://localhost:8080/v1/playground/limits \
            | jq -e '.data.max_source_bytes == 32768' > /dev/null
      - name: Upload API log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-api-log
          path: api.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload playground broker log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-playgroundd-log
          path: playgroundd.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop background processes
        if: ${{ always() }}
        run: |
          for pidfile in api.pid playgroundd.pid .minio/minio.pid; do
            if test -f "$pidfile"; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
